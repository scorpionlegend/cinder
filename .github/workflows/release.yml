name: release

# Builds a downloadable Cinder package for every supported target. Pushing a
# `v*` tag publishes the artifacts as a GitHub Release; any other run only
# builds and uploads them as workflow artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cef: linux64
            formats: tar.gz,deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cef: linuxarm64
            formats: tar.gz,deb
          - os: macos-13
            target: x86_64-apple-darwin
            cef: macosx64
            formats: tar.gz
          # The arm64 macOS runner configuration is not available to this
          # account, so the arm64 bundle is cross-compiled on the Intel runner.
          # Its smoke test is skipped because the binary cannot execute there.
          - os: macos-13
            target: aarch64-apple-darwin
            cef: macosarm64
            formats: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cef: windows64
            formats: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "CINDER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CINDER_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Fetch pinned CEF
        run: python3 packaging/fetch-cef.py --platform ${{ matrix.cef }} --dest cef

      - name: Build
        env:
          CINDER_CEF_ROOT: ${{ github.workspace }}/cef
        run: cargo build --release --target ${{ matrix.target }} -p cinder-cli -p cinder-adapter-cef

      - name: Package
        run: >
          cargo run -p cinder-dist --release --
          --target ${{ matrix.target }}
          --cef-root cef
          --out dist
          --version ${{ env.CINDER_VERSION }}
          --formats ${{ matrix.formats }}

      # A cross build cannot be executed on the runner, so at least prove the
      # binary really is the architecture the bundle claims to be.
      - name: Verify bundle architecture
        if: ${{ matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify && tar -xzf dist/cinder-*.tar.gz -C verify
          archs=$(lipo -archs verify/cinder-*/Cinder.app/Contents/MacOS/cinder)
          echo "bundle archs: $archs"
          [[ "$archs" == *arm64* ]]

      - name: Smoke test the bundle
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *linux*)
              mkdir -p smoke && tar -xzf dist/cinder-*.tar.gz -C smoke
              ./smoke/cinder-*/cinder demo > /dev/null
              ;;
            *darwin*)
              mkdir -p smoke && tar -xzf dist/cinder-*.tar.gz -C smoke
              ./smoke/cinder-*/Cinder.app/Contents/MacOS/cinder demo > /dev/null
              ;;
            *windows*)
              mkdir -p smoke && unzip -q dist/cinder-*.zip -d smoke
              ./smoke/cinder-*/cinder.exe demo > /dev/null
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: cinder-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.manifest.json
          if-no-files-found: error

  rpm:
    name: rpm (x86_64)
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cinder-x86_64-unknown-linux-gnu
          path: dist

      - name: Build RPM from the portable bundle
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          version=$(python3 -c "import json,glob;print(json.load(open(glob.glob('dist/*.manifest.json')[0]))['version'])")
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/cinder-${version}-x86_64-unknown-linux-gnu.tar.gz \
             rpmbuild/SOURCES/cinder-${version}-x86_64.tar.gz
          rpmbuild -bb packaging/linux/cinder.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "version ${version}" \
            --define "_cinder_arch x86_64" \
            --define "_cinder_root cinder-${version}-x86_64-unknown-linux-gnu" \
            --define "_cinder_desktop $(pwd)/packaging/linux/cinder.desktop" \
            --define "_cinder_metainfo $(pwd)/packaging/linux/io.cinder.Cinder.metainfo.xml" \
            --define "debug_package %{nil}"
          mkdir -p dist
          cp rpmbuild/RPMS/*/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cinder-rpm-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: publish
    runs-on: ubuntu-22.04
    needs: [build, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.1.0-pre.1 is a pre-release; v0.1.0 is not.
          extra=()
          case "${GITHUB_REF_NAME}" in
            *-*) extra+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cinder ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${extra[@]}" \
            artifacts/*
