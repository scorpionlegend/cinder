name: release

# Builds a downloadable Cinder package for every supported target. Pushing a
# `v*` tag publishes the artifacts as a GitHub Release; any other run only
# builds and uploads them as workflow artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep the C shim and the Rust objects on the same minimum macOS version;
  # without it clang stamps the shim with the SDK version and ld warns that the
  # object was built for a newer macOS than the binary.
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cef: linux64
            formats: tar.gz,deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cef: linuxarm64
            formats: tar.gz,deb
          # macos-13 is retired and macos-14 arm64 is not available to this
          # account, so both Apple targets use images that actually start:
          # macos-15-intel is x86_64, macos-latest is macos-26-arm64.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cef: macosx64
            formats: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            cef: macosarm64
            formats: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cef: windows64
            formats: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "CINDER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CINDER_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Fetch pinned CEF
        run: python3 packaging/fetch-cef.py --platform ${{ matrix.cef }} --dest cef

      - name: Build
        env:
          CINDER_CEF_ROOT: ${{ github.workspace }}/cef
          # Baked into the binary so `cinder update` compares against the tag it
          # was published as, not the crate version.
          CINDER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        # The `cef` feature is off by default so a plain `cargo build` needs no
        # CEF headers; a shipped bundle must turn on `window`, which pulls in
        # `cef`, or `cinder <url>` has no window to open.
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p cinder-cli -p cinder-adapter-cef
          --features cinder-cli/window

      - name: Package
        run: >
          cargo run -p cinder-dist --release --
          --target ${{ matrix.target }}
          --cef-root cef
          --out dist
          --version ${{ env.CINDER_VERSION }}
          --formats ${{ matrix.formats }}

      - name: Check deb dependencies resolve
        if: contains(matrix.formats, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          apt-get install -s ./dist/*.deb

      - name: Smoke test the bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *linux*)
              mkdir -p smoke && tar -xzf dist/cinder-*.tar.gz -C smoke
              bin=./smoke/cinder-*/cinder
              ;;
            *darwin*)
              mkdir -p smoke && tar -xzf dist/cinder-*.tar.gz -C smoke
              bin=./smoke/cinder-*/Cinder.app/Contents/MacOS/cinder
              ;;
            *windows*)
              mkdir -p smoke && unzip -q dist/cinder-*.zip -d smoke
              bin=./smoke/cinder-*/cinder.exe
              ;;
          esac
          $bin demo > /dev/null
          # `demo` runs on the mock engine, so it passes even in a bundle built
          # without the `cef` feature. Fail if `browse` is missing.
          if $bin help | grep -q "no web engine"; then
            echo "bundle was built without the cef feature" >&2
            exit 1
          fi
          # The window layer is what `cinder <url>` needs; a cef-only bundle
          # would print help instead of opening a window.
          if $bin help | grep -q "no window layer"; then
            echo "bundle was built without the window feature" >&2
            exit 1
          fi
          # A bundle without ICU data or pak files still starts, but cannot
          # render: CEF needs icudtl.dat and at least one locale pak. Linux and
          # Windows keep them in locales/*.pak, macOS in *.lproj/locale.pak.
          if ! find smoke -name icudtl.dat -print -quit | grep -q .; then
            echo "bundle has no icudtl.dat" >&2
            exit 1
          fi
          if ! find smoke \( -path '*locales/*.pak' -o -path '*.lproj/locale.pak' \) -print -quit | grep -q .; then
            echo "bundle has no locale pak" >&2
            exit 1
          fi

      # The page only appears where the shell can hand the engine a native
      # parent handle. Run the bounded window selftest and require a view: with
      # no parent the engine refuses the surface and the window exits with
      # "could not create the page".
      # Page embedding is proven on Linux; on Windows and macOS the window
      # opens with chrome but CEF still aborts while creating the view, so this
      # step reports the trace without blocking the release. Flip
      # continue-on-error off once the crash is fixed.
      - name: Window selftest
        if: contains(matrix.target, 'windows') || contains(matrix.target, 'darwin')
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *darwin*) bin=./smoke/cinder-*/Cinder.app/Contents/MacOS/cinder ;;
            *windows*) bin=./smoke/cinder-*/cinder.exe ;;
          esac
          # macOS ships no `timeout`, and a hung CEF init would hold the job
          # until the six-hour limit, so bound every run with a watchdog.
          bounded() {
            local secs=$1 out=$2 code=0
            shift 2
            "$@" >"$out" 2>&1 &
            local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) &
            local watchdog=$!
            wait "$pid" || code=$?
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            return $code
          }
          bounded 60 "$RUNNER_TEMP/selftest.out" env \
            CINDER_CEF_LOG="$RUNNER_TEMP/cef-debug.log" \
            CINDER_NO_UPDATE_CHECK=1 CINDER_WINDOW_SELFTEST=8 \
            $bin about:blank && code=0 || code=$?
          out=$(cat "$RUNNER_TEMP/selftest.out")
          echo "$out"
          echo "exit code: $code"
          if [ -f "$RUNNER_TEMP/cef-debug.log" ]; then
            echo "=== cef log ==="
            tail -80 "$RUNNER_TEMP/cef-debug.log"
          fi
          if ! grep -q "window selftest: .*view=view-" <<<"$out"; then
            echo "::warning::the window never got a page view (exit $code)"
          fi
          # Each probe initializes CEF one way and exits; the exit code says
          # whether that variant survived. Together they separate a thread
          # affinity problem from a settings, GPU or windowless one.
          for v in main main-windowless thread thread-windowless single inproc; do
            bounded 60 "$RUNNER_TEMP/probe-$v.out" env \
              CINDER_CEF_LOG="$RUNNER_TEMP/cef-probe-$v.log" \
              CINDER_CEF_PROBE=$v CINDER_NO_UPDATE_CHECK=1 \
              $bin about:blank && pc=0 || pc=$?
            echo "probe $v exit=$pc"
            grep -E "^probe|shim init|cinder: " "$RUNNER_TEMP/probe-$v.out" | tail -6 || true
          done
          # `browse` uses the same engine without a window: if it also dies the
          # fault is in initialization, not in the native parent handoff.
          bounded 90 "$RUNNER_TEMP/browse.out" env CINDER_NO_UPDATE_CHECK=1 \
            $bin browse about:blank && bc=0 || bc=$?
          echo "browse exit=$bc"
          tail -15 "$RUNNER_TEMP/browse.out"

      # A SIGTRAP inside Chromium leaves no log line, but lldb stops on it and
      # can print the stack. Batch mode runs the selftest and dumps the frames.
      - name: Window selftest backtrace
        if: always() && contains(matrix.target, 'darwin')
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/selftest.out"
          if [ -f "$out" ] && grep -q "window selftest: .*view=view-" "$out"; then
            echo "selftest produced a view; no backtrace needed"
            exit 0
          fi
          bin=$(echo ./smoke/cinder-*/Cinder.app/Contents/MacOS/cinder)
          # lldb waits forever on a hang, and `timeout` is not on macOS; perl's
          # alarm is.
          perl -e 'alarm 150; exec @ARGV' lldb -b \
            -o "settings set target.env-vars CINDER_WINDOW_SELFTEST=8 CINDER_NO_UPDATE_CHECK=1" \
            -o run -o "thread backtrace" -o quit -- "$bin" about:blank 2>&1 | tail -80 || true

      # A SIGTRAP inside Chromium leaves no log line, but macOS writes a crash
      # report. Print the newest ones so the faulting frame is in the job log.
      - name: Window selftest crash reports
        if: always() && contains(matrix.target, 'darwin')
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/Library/Logs/DiagnosticReports"
          if [ ! -d "$dir" ]; then
            echo "no crash report directory"
            exit 0
          fi
          find "$dir" -name '*.ips' -newermt '-15 minutes' | head -10
          for f in $(find "$dir" -name '*.ips' -newermt '-15 minutes' | head -2); do
            echo "=== $f ==="
            head -c 40000 "$f"
            echo
          done

      # Windows ships an .msi and a setup .exe on top of the portable .zip.
      # Both are built from the same staged bundle the smoke test just ran.
      - name: Build Windows installers
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:CINDER_VERSION
          # MSI and the setup .exe only accept numeric versions:
          # 0.1.0-pre.11 -> 0.1.0.11, 0.1.0 -> 0.1.0.0
          $base = ($version -split '-')[0]
          $pre = 0
          if ($version -match '-pre\.(\d+)$') { $pre = [int]$Matches[1] }
          $numeric = "$base.$pre"

          $stage = Join-Path $PWD 'stage-win'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $zip = (Get-ChildItem dist/cinder-*.zip | Select-Object -First 1).FullName
          tar -xf $zip -C $stage
          $root = (Get-ChildItem $stage -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path (Join-Path $root 'cinder.exe'))) {
            throw "staged bundle has no cinder.exe"
          }
          $staged = (Get-ChildItem $root -Recurse -File).Count
          Write-Host "staged bundle: $staged files under $root"

          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (-not (Test-Path "$wix\candle.exe")) { throw "WiX 3 not found at $wix" }
          New-Item -ItemType Directory -Force -Path obj | Out-Null
          # -ag keeps component GUIDs stable across builds (generated from the
          # file path at compile time), which is what makes upgrades work.
          & "$wix\heat.exe" dir $root -cg CinderFiles -dr INSTALLFOLDER -ag `
            -sfrag -srd -sreg -scom -var var.SourceDir -out files.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat failed" }
          # candle's -out only accepts a single input file, so compile the two
          # sources separately and let light link the objects.
          & "$wix\candle.exe" -arch x64 "-dSourceDir=$root" "-dProductVersion=$numeric" `
            -out obj\cinder.wixobj packaging\windows\cinder.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed on cinder.wxs" }
          & "$wix\candle.exe" -arch x64 "-dSourceDir=$root" `
            -out obj\files.wixobj files.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed on files.wxs" }
          $msi = "dist\cinder-$version-x86_64-pc-windows-msvc.msi"
          # -sval skips ICE validation; the ICEs that fire here are the benign
          # per-user-shortcut ones, and light treats them as errors.
          & "$wix\light.exe" -sval -out $msi obj\*.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed" }

          # Ask the package itself what it carries: the File table is the
          # authoritative list, and reading it costs nothing next to extracting
          # a 600 MB payload.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null,
            $installer, @((Resolve-Path $msi).Path, 0))
          # Column 1 is the File key (heat's generated `fil<GUID>` identifier),
          # column 2 is the actual name, which may be `SHORT|LONG`.
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db,
            @('SELECT `File`,`FileName` FROM `File`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $names = @()
          while ($true) {
            $row = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $row) { break }
            $name = $row.GetType().InvokeMember('StringData', 'GetProperty', $null, $row, @(2))
            $names += ($name -split '\|')[-1]
          }
          Write-Host "MSI File table: $($names.Count) entries"
          Write-Host "  $($names -join ', ')"
          if ($names.Count -eq 0) { throw "MSI File table is empty: heat harvested nothing" }
          if (-not ($names -match '^(?i)cinder\.exe$')) {
            throw "MSI File table has no cinder.exe"
          }

          # Then the real thing: an administrative install unpacks every file
          # without touching Program Files.
          $admin = Join-Path $PWD 'msi-check'
          $msiLog = Join-Path $PWD 'msi-admin.log'
          $msiPath = (Resolve-Path $msi).Path
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$msiPath`"", '/qn', "/l*v `"$msiLog`"", "TARGETDIR=`"$admin`"")
          if ($p.ExitCode -ne 0) {
            Write-Host "msiexec /a exited $($p.ExitCode); log tail:"
            if (Test-Path $msiLog) { Get-Content $msiLog -Tail 40 }
            throw "administrative install of $msi failed with $($p.ExitCode)"
          }
          $found = Get-ChildItem $admin -Recurse -Filter cinder.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $found) {
            Write-Host "administrative install produced no cinder.exe; tree:"
            if (Test-Path $admin) { Get-ChildItem $admin -Recurse | Select-Object -First 40 FullName }
            throw "administrative install of $msi produced no cinder.exe"
          }

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          $env:CINDER_STAGE_DIR = $root
          $env:CINDER_WIN_VERSION = $version
          $env:CINDER_WIN_VERSION_NUMERIC = $numeric
          $env:CINDER_BUNDLE_VERSION = $version
          & $iscc "/O$PWD\dist" packaging\windows\cinder.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          # Same idea for the setup .exe: silent install into a scratch dir,
          # check the binary landed, then uninstall.
          $setup = (Resolve-Path "dist\cinder-$version-x86_64-pc-windows-msvc-setup.exe").Path
          $inst = Join-Path $PWD 'exe-check'
          $p = Start-Process $setup -Wait -PassThru -ArgumentList `
            "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$inst`""
          if ($p.ExitCode -ne 0) { throw "setup.exe exited $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $inst 'cinder.exe'))) {
            throw "silent install of $setup produced no cinder.exe"
          }
          Start-Process (Join-Path $inst 'unins000.exe') -Wait -ArgumentList `
            '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'

          Get-ChildItem dist\*.msi, dist\*-setup.exe | Format-Table Name, Length

      # macOS ships a .dmg alongside the portable .tar.gz.
      - name: Build dmg
        if: contains(matrix.target, 'darwin')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmg-stage
          tar -xzf dist/cinder-*.tar.gz -C dmg-stage
          app=$(echo dmg-stage/cinder-*/Cinder.app)
          packaging/macos/make-dmg.sh "$app" "Cinder ${CINDER_VERSION}" \
            "dist/cinder-${CINDER_VERSION}-${{ matrix.target }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: cinder-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.msi
            dist/*-setup.exe
            dist/*.dmg
            dist/*.manifest.json
          if-no-files-found: error

  rpm:
    name: rpm (x86_64)
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cinder-x86_64-unknown-linux-gnu
          path: dist

      - name: Build RPM from the portable bundle
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          version=$(python3 -c "import json,glob;print(json.load(open(glob.glob('dist/*.manifest.json')[0]))['version'])")
          # rpm forbids '-' in the Version tag, so a pre-release suffix moves
          # into Release: 0.1.0-pre.1 -> Version 0.1.0, Release pre.1.1.
          rpm_version=${version%%-*}
          if [ "$rpm_version" = "$version" ]; then
            rpm_release=1
          else
            rpm_release="${version#*-}.1"
          fi
          echo "rpm version=$rpm_version release=$rpm_release bundle=$version"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "dist/cinder-${version}-x86_64-unknown-linux-gnu.tar.gz" \
             "rpmbuild/SOURCES/cinder-${version}-x86_64.tar.gz"
          sed -e "s|^Version:.*|Version:        ${rpm_version}|" \
              -e "s|^Release:.*|Release:        ${rpm_release}%{?dist}|" \
              packaging/linux/cinder.spec > rpmbuild/SPECS/cinder.spec
          rpmbuild -bb rpmbuild/SPECS/cinder.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_cinder_version ${version}" \
            --define "_cinder_arch x86_64" \
            --define "_cinder_root cinder-${version}-x86_64-unknown-linux-gnu" \
            --define "_cinder_desktop $(pwd)/packaging/linux/cinder.desktop" \
            --define "_cinder_metainfo $(pwd)/packaging/linux/io.cinder.Cinder.metainfo.xml" \
            --define "debug_package %{nil}"
          mkdir -p dist
          cp rpmbuild/RPMS/*/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cinder-rpm-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: publish
    runs-on: ubuntu-22.04
    needs: [build, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.1.0-pre.1 is a pre-release; v0.1.0 is not.
          extra=()
          case "${GITHUB_REF_NAME}" in
            *-*) extra+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cinder ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${extra[@]}" \
            artifacts/*
