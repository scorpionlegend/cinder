[package]
name = "cinder-cli"
description = "Cinder command-line shell: drives the orchestrator against the mock engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cinder"
path = "src/main.rs"

[dependencies]
cinder-adapter = { path = "../cinder-adapter" }
cinder-adapter-mock = { path = "../cinder-adapter-mock" }
cinder-core = { path = "../cinder-core" }
cinder-adapter-cef = { path = "../cinder-adapter-cef", optional = true }
cinder-window = { path = "../cinder-window", optional = true }

[features]
# Links the real web engine. Off by default so a plain `cargo build` needs no
# CEF headers; `cargo build -p cinder-cli --features cef` turns it on.
cef = ["dep:cinder-adapter-cef"]
# Adds the OS window that shows the engine's frames. Implies `cef`.
window = ["cef", "dep:cinder-window"]
